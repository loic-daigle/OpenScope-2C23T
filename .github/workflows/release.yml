name: Release

# Publish a release: push a tag such as v2026.11.5-ui1, or open the Actions
# tab, pick "Release" and press "Run workflow" (the tag is created for you).
# The tag must match VERSION in the Makefile (the DMM test checks the
# firmware's version string against it), and docs/releases/<tag>.md holds
# the release notes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (must match VERSION in the Makefile)'
        required: true
        default: 'v2026.11.5-ui1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run host regression tests
        run: make test
      - name: Build release binaries
        run: make release
      - name: Check the binaries carry the tag's version
        run: |
          test -f "dist/F2C23T-${TAG}-08008000.bin"
          test -f "dist/F2C23T-${TAG}-HW4.0-08007000.bin"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: dist/*.bin
